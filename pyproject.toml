[project]
name = "sega-rl"
version = "0.1.0"
description = "PPO agents for Sega Genesis games (Street Fighter II' SCE, Sonic) on stable-retro, with training-health monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "stable-retro>=1.0.1",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "optuna>=4.0",
    "mlflow-skinny>=2.17",
    "imageio[ffmpeg]>=2.35",
    "tensorboard>=2.17",
    "torch==2.14.1",  # same version as the cu126 wheel the image installs
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sega-rl = "sega_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sega_rl"]

# Local + CI use CPU torch; runpod/Dockerfile swaps in the cu126 wheel after `uv sync`.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["rom: needs an imported ROM (skipped when the integration has no ROM)"]

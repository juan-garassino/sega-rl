name: build-push

on:
  push:
    branches: [main]
    paths: ['src/**', 'runpod/**', 'pyproject.toml', 'uv.lock', '.github/workflows/build-push.yml']
  pull_request:
    paths: ['runpod/**', 'pyproject.toml', 'uv.lock', '.github/workflows/build-push.yml']
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CUDA devel base + CUDA torch needs more disk than a stock runner has free.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the slim CPU image (default for CPU pods)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: runpod/Dockerfile.cpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/juan-garassino/sega-rl:cpu
            ghcr.io/juan-garassino/sega-rl:cpu-${{ github.sha }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: runpod/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}  # PRs only prove the image builds
          tags: |
            ghcr.io/juan-garassino/sega-rl:latest
            ghcr.io/juan-garassino/sega-rl:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
